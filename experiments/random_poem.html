<style>
    @media (orientation: landscape) {
        #content {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            max-height: 85vh; /* 85% of the viewport height */
            overflow-x: auto; /* Allow horizontal scrolling if columns overflow */
            align-content: flex-start;
        }
        #content p {
            margin-right: 2rem; /* Add space between columns */
        }
    }
</style>
<body>
<div id="ctl">
    每句字数：<input type="number" id="length" value="7" min="1" max="20"/>
    <br>
    批量生成：<input type="number" id="num" value="40" min="1" max="1000"/>
    <button onclick="batch_generate()">生成</button>
</div>
<div id="content"></div>
</body>


<script>

var gbkDecoder = new TextDecoder("gbk");

function random_cnstring(n) {
    // randomly generate a string of n Chinese characters
    let str = "";
    for (let i = 0; i < n; i++) {
        let row=Math.floor(Math.random() * 33)+16;  // gbk 区码
        let cell = Math.floor(Math.random() * 94)+1; // gbk 位码

        str += gbkDecoder.decode(new Uint8Array([row+160, cell+160]));
    }
    return str;
}

function batch_generate() {
    let num = document.getElementById("num").value;
    let length = document.getElementById("length").value;
    let content = document.getElementById("content");
    content.innerHTML = "";
    for (let i = 0; i < num; i++) {
        let poem = random_cnstring(length); // generate a random string of specified length
        let p = document.createElement("p");
        p.textContent = poem;
        content.appendChild(p);
    }
}

</script>
